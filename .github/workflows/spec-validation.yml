name: Specification Validation

on:
  push:
    paths:
      - 'specs/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'scripts/validate_specs.py'
      - 'scripts/run_phase0a_tests.py'
      - 'phase0a/**'
      - 'tests/**'
      - '.github/workflows/spec-validation.yml'
  pull_request:
    paths:
      - 'specs/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'scripts/validate_specs.py'
      - 'scripts/run_phase0a_tests.py'
      - 'phase0a/**'
      - 'tests/**'
      - '.github/workflows/spec-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record checked-out revision and runtime
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          git rev-parse HEAD
          uname -smr
          python3 --version
      - name: Validate specification baseline
        run: python3 scripts/validate_specs.py
      - name: Verify offline Phase 0A contracts
        run: python3 -B scripts/run_phase0a_tests.py
