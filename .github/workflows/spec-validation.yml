name: Specification Validation

on:
  push:
    paths:
      - 'specs/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'scripts/validate_specs.py'
      - '.github/workflows/spec-validation.yml'
  pull_request:
    paths:
      - 'specs/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'scripts/validate_specs.py'
      - '.github/workflows/spec-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_specs.py
